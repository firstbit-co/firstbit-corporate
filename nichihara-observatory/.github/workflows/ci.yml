# 専用リポジトリに切り出した後に有効になる CI(firstbit-corporate 内では動かない)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 「これからのイベント」の鮮度を保つため毎朝 6:00 JST にビルド。デプロイ手順はホスティング決定後に追加
  schedule:
    - cron: '0 21 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
