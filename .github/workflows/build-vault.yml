name: Build vault

# vault のノートを push すると、索引 (vault/INDEX.md)、公開ノート (notes/)、
# sitemap.xml を再生成してコミットし直す。GitHub Pages はそのコミットを配信する。
on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-vault.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vault
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lastmod をコミット日から求めるため履歴をすべて取得する
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ノートと索引を生成
        run: npm run build

      - name: 生成物をコミット
        run: |
          if [ -z "$(git status --porcelain vault/INDEX.md notes sitemap.xml)" ]; then
            echo "生成物に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/INDEX.md notes sitemap.xml
          git commit -m "chore: vault からノートと索引を再生成"
          git push
